<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B5A"/>
      <stop offset="100%" stop-color="#E23428"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF3F0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7A0C06" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Fond rouge corail doux Akademia -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  
  <!-- Petites étincelles discrètes en arrière-plan -->
  <circle cx="86" cy="86" r="14" fill="#FFFFFF" fill-opacity="0.25"/>
  <circle cx="426" cy="98" r="18" fill="#FFFFFF" fill-opacity="0.22"/>
  <circle cx="94" cy="420" r="12" fill="#FFFFFF" fill-opacity="0.2"/>

  <!-- Mascotte Akademia (Nuage avec yeux globuleux) -->
  <g filter="url(#shadow)">
    <!-- Forme du nuage tout en rondeur -->
    <path d="M 170 380 
             C 98 380, 68 328, 92 268 
             C 62 208, 108 142, 175 158 
             C 200 92, 290 82, 342 132 
             C 398 98, 458 148, 442 212 
             C 478 262, 452 338, 396 364 
             C 366 384, 332 378, 306 374 
             C 272 388, 206 388, 170 380 Z" 
          fill="url(#cloudGrad)" 
          stroke="#1E1B2E" 
          stroke-width="15" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>
          
    <!-- Joues rosées kawaii -->
    <ellipse cx="162" cy="292" rx="20" ry="13" fill="#FFA59B" fill-opacity="0.8" />
    <ellipse cx="348" cy="292" rx="20" ry="13" fill="#FFA59B" fill-opacity="0.8" />

    <!-- Oeil Gauche (Très grand, globuleux avec cils) -->
    <g>
      <!-- Cils expressifs -->
      <path d="M 194 198 L 176 178" stroke="#1E1B2E" stroke-width="8" stroke-linecap="round"/>
      <path d="M 216 190 L 210 166" stroke="#1E1B2E" stroke-width="8" stroke-linecap="round"/>
      
      <!-- Blanc de l'œil -->
      <ellipse cx="208" cy="246" rx="38" ry="46" fill="#FFFFFF" stroke="#1E1B2E" stroke-width="13"/>
      <!-- Pupille noire profonde -->
      <ellipse cx="215" cy="249" rx="26" ry="33" fill="#141124"/>
      <!-- Reflet brillant principal -->
      <circle cx="204" cy="232" r="11" fill="#FFFFFF"/>
      <!-- Reflet secondaire -->
      <circle cx="225" cy="264" r="5" fill="#FFFFFF"/>
    </g>

    <!-- Oeil Droit (Très grand, globuleux avec cils) -->
    <g>
      <!-- Cils expressifs -->
      <path d="M 296 190 L 302 166" stroke="#1E1B2E" stroke-width="8" stroke-linecap="round"/>
      <path d="M 318 198 L 336 178" stroke="#1E1B2E" stroke-width="8" stroke-linecap="round"/>
      
      <!-- Blanc de l'œil -->
      <ellipse cx="302" cy="246" rx="38" ry="46" fill="#FFFFFF" stroke="#1E1B2E" stroke-width="13"/>
      <!-- Pupille noire profonde -->
      <ellipse cx="295" cy="249" rx="26" ry="33" fill="#141124"/>
      <!-- Reflet brillant principal -->
      <circle cx="284" cy="232" r="11" fill="#FFFFFF"/>
      <!-- Reflet secondaire -->
      <circle cx="305" cy="264" r="5" fill="#FFFFFF"/>
    </g>

    <!-- Sourire craquant -->
    <path d="M 236 296 Q 255 318 274 296" fill="none" stroke="#1E1B2E" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
