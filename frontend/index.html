<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5B4BFF" />
    <meta name="description" content="Akademia : apprenez en jouant. Cours, QCM, épreuves, cartes mémoire, niveaux et badges." />
    <title>Akademia · Apprendre en jouant</title>
    <script>
      // évite le flash de thème au chargement
      try {
        var t = localStorage.getItem('akademia:theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
