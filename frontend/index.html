<!doctype html>
<html lang="fr" data-theme="corail">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FF574A" id="meta-theme-color" />
    <meta name="description" content="Akademia : Apprends, Progresse, Gagne. Cours, QCM, défis, battles de filières et classement universitaire." />
    <title>Akademia · Apprends, Progresse, Gagne</title>
    <script>
      // Thème piloté par la filière (ARI -> corail, AIP -> violet, défaut -> corail)
      try {
        var f = localStorage.getItem('akademia:filiere');
        var t = f === 'AIP' ? 'violet' : 'corail';
        var colors = { corail: '#FF574A', violet: '#7C3AED' };
        document.documentElement.setAttribute('data-theme', t);
        var meta = document.getElementById('meta-theme-color');
        if (meta) meta.setAttribute('content', colors[t]);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
