<!doctype html>
<html lang="fr" data-theme="corail">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Akademia · Université</title>
    <meta
      name="description"
      content="Akademia : Apprends, Progresse, Gagne. Cours, QCM, défis, battles de filières et classement universitaire."
    />
    <meta name="theme-color" content="#FF574A" id="meta-theme-color" />

    <!-- Icônes & Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Web App Manifest (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Métadonnées PWA iOS / Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Akademia" />

    <!-- Métadonnées PWA Android / Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Akademia" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Typographie Playful Ronde & Moderne -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      // Thème piloté par la filière (ARI -> corail, AIP -> violet, défaut -> corail)
      try {
        var f = localStorage.getItem('akademia:filiere');
        var t = f === 'AIP' ? 'violet' : 'corail';
        var colors = { corail: '#FF574A', violet: '#7C3AED' };
        document.documentElement.setAttribute('data-theme', t);
        var meta = document.getElementById('meta-theme-color');
        if (meta) meta.setAttribute('content', colors[t]);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
